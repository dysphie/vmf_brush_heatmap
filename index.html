<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VMF Brush Heatmap</title>
<style>
:root{--bg:#c0c0c0;--panel:#c0c0c0;--text:#000;--mute:#555;--line:#808080;--acc:#000080;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#008080;color:#000;font:11px/1.35 Tahoma,"MS Sans Serif",Arial,sans-serif;display:flex;gap:4px;padding:4px}
#side{width:340px;max-width:45%;background:#c0c0c0;overflow-y:auto;overflow-x:hidden;padding:3px 0 8px;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #dfdfdf,inset -2px -2px #808080,inset 2px 2px #fff}
#side>*:not(.title-bar){margin-left:8px;margin-right:8px}
.title-bar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 4px;margin:0 3px 8px;position:sticky;top:0;z-index:2}
#view{flex:1;position:relative;min-width:0;background:#000;border:2px solid;border-color:#808080 #fff #fff #808080}
canvas{display:block;width:100%;height:100%}
h2{font-size:11px;font-weight:bold;margin:12px 8px 6px;padding-bottom:3px;border-bottom:1px solid #808080;box-shadow:0 1px #fff;overflow:hidden}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
input[type=number],select,#drop,#clswrap,#cells,#sel>div:nth-child(2),.bar{box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a;background:#fff;border:none;border-radius:0}
input[type=number],select{width:90px;height:21px;padding:3px 4px;font:inherit;color:#000}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:13px;height:13px;margin:0;flex:none;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a;background:#fff}
input[type=checkbox]:checked{background:#fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='9'%3E%3Cpath d='M1.5 4.5 3.5 6.5 7.5 2' stroke='%23000' stroke-width='1.8' fill='none'/%3E%3C/svg%3E") center no-repeat}
input[type=range]{flex:1;min-width:0;accent-color:#000080}
.mini{background:#c0c0c0;color:#000;border:none;border-radius:0;min-width:75px;min-height:23px;padding:0 10px;font:inherit;cursor:pointer;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.mini:active{box-shadow:inset -1px -1px #fff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px #808080}
#drop{padding:14px;text-align:center;color:#000;cursor:pointer}
#drop.over{background:#ffffe1}
.bar{height:14px;margin:4px 8px;padding:2px}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;background:#fff;color:#000}
#side>table{width:calc(100% - 16px)}
td{padding:2px 4px}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover{background:#000080;color:#fff}
#clswrap{max-height:240px;overflow-y:auto}
.mute{color:#555;font-size:11px}
#legend{position:absolute;right:8px;bottom:8px;background:#c0c0c0;padding:5px 8px;font-size:11px;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
#grad{height:8px;width:140px;background:linear-gradient(90deg,hsl(240,90%,55%),hsl(180,90%,50%),hsl(120,90%,50%),hsl(60,90%,50%),hsl(0,90%,50%))}
#tip{position:absolute;pointer-events:none;background:#ffffe1;color:#000;border:1px solid #000;padding:2px 5px;font-size:11px;display:none;white-space:nowrap;z-index:5}
@media (max-width:700px){body{flex-direction:column}#side{width:100%;max-width:none;height:45%}#view{height:55%}}
</style>
</head>
<body>
<div id="side">
  <div class="title-bar">VMF Brush Heatmap</div>
  <div id="drop">Drop a .vmf here or click to browse<input id="file" type="file" accept=".vmf,.txt" hidden></div>
  <div id="out" class="mute" style="margin-top:8px"></div>

  <h2>Brush budget</h2>
  <div id="budget" class="mute">–</div>
  <div class="bar"><i id="bfill" style="width:0"></i></div>

  <h2>Filters</h2>
  <label>Cell size (units)
    <select id="cell"><option>64</option><option>128</option><option selected>256</option><option>512</option><option>1024</option></select></label>
  <label><span>World brushes</span><input type="checkbox" id="fw" checked></label>
  <label><span>Entity brushes (func_*)</span><input type="checkbox" id="fe" checked></label>
  
  <label>Max brush dimension <input type="number" id="fmax" value="0" min="0" title="0 = off"></label>
  <label>Min cell count <input type="range" id="fmin" min="1" max="50" value="1"><span id="fminv">1</span></label>
  <label>Opacity <input type="range" id="fop" min="10" max="100" value="55"></label>
  <label><span>Log color scale</span><input type="checkbox" id="flog" checked></label>
  <label>Color by <select id="fcol"><option value="d">Density</option><option value="c">Entity class</option></select></label>
  <label>Z layer <input type="range" id="fz" min="0" max="0" value="0"><span id="fzv">All</span></label>
  <label><span>Outline all brushes</span><input type="checkbox" id="fol"></label>
  <div style="display:flex;gap:6px;margin-top:6px"><button class="mini" id="v3">3D view</button><button class="mini" id="v2">Top-down view</button></div>

  <h2>Selected cell <button class="mini" id="selcopy" style="float:right">Copy IDs</button></h2>
  <div id="sel" class="mute">Click a cell in the view.</div>
  <h2>Hottest cells</h2>
  <table id="cells"></table>
  <h2>By entity class (brush count)</h2>
  <div style="display:flex;gap:6px;margin-bottom:6px"><button class="mini" id="clsall">Show all</button><button class="mini" id="clsnone">Hide all</button></div>
  <div id="clswrap"><table id="classes"></table></div>
  <h2>Diagnostics</h2>
  <div id="diag" class="mute"></div>
</div>
<div id="view"><canvas id="c"></canvas><div id="tip"></div>
  <div id="legend"><span id="lt">brushes per cell</span><div id="grad"></div><div style="display:flex;justify-content:space-between"><span id="lmin">0</span><span id="lmax">0</span></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id), LIMIT=8192;
let brushes=[], mesh=null, fitted=false, hidden=new Set(), clsKeys=[];

function parseKV(text){
  const re=/"([^"]*)"|([{}])|([^\s{}"]+)/g, toks=[]; let m;
  while((m=re.exec(text))) toks.push(m[2]?{b:m[2]}:{s:m[1]!==undefined?m[1]:m[3]});
  const root={name:'root',kv:{},ch:[]}, st=[root];
  for(let i=0;i<toks.length;i++){
    const t=toks[i], top=st[st.length-1];
    if(t.b==='}'){ if(st.length>1) st.pop(); continue; }
    if(t.s===undefined) continue;
    const n=toks[i+1];
    if(n&&n.b==='{'){ const b={name:t.s,kv:{},ch:[]}; top.ch.push(b); st.push(b); i++; }
    else if(n&&n.s!==undefined){ top.kv[t.s]=n.s; i++; }
  }
  return root;
}
function collect(block,cls,isWorld,hidden,out){
  for(const c of block.ch){
    if(c.name==='solid'){ if(!c.ch.some(sd=>sd.ch.some(x=>x.name==='dispinfo'))) out.push(toBrush(c,cls,isWorld,hidden)); }
    else if(c.name==='hidden') collect(c,cls,isWorld,true,out);
  }
}
function toBrush(s,cls,isWorld,hidden){
  const mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9]; let sides=0;
  for(const sd of s.ch){
    if(sd.name!=='side') continue; sides++;
    const n=(sd.kv.plane||'').match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/gi);
    if(!n||n.length<9) continue;
    for(let i=0;i<9;i++){ const v=+n[i], a=i%3; if(v<mn[a])mn[a]=v; if(v>mx[a])mx[a]=v; }
  }
  const c=mn.map((v,i)=>(v+mx[i])/2), dim=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]);
  return {id:s.kv.id,cls,isWorld,hidden,sides,mn,mx,c,dim};
}
function load(text){
  const root=parseKV(text), out=[];
  for(const b of root.ch){
    if(b.name==='world') collect(b,'worldspawn',true,false,out);
    else if(b.name==='entity') collect(b,b.kv.classname||'unknown',false,false,out);
  }
  brushes=out.filter(b=>isFinite(b.c[0])&&b.mn[0]<1e8);
  fitted=false; hidden=new Set(); selCell=null; stats(); rebuild();
}

function stats(){
  const n=brushes.length, pct=Math.min(100,n/LIMIT*100);
  const w=brushes.filter(b=>b.isWorld).length, e=n-w;
  const col=n>LIMIT?'#e03131':n>LIMIT*.9?'#f08c00':'var(--acc)';
  $('budget').innerHTML=`<b style="color:var(--text);font-size:18px">${n.toLocaleString()}</b> / ${LIMIT} (${pct.toFixed(0)}%)<br>world ${w} · entity ${e} · displacements excluded`;
  $('bfill').style.width=pct+'%'; $('bfill').style.background=col;
  const cls={}; brushes.forEach(b=>cls[b.cls]=(cls[b.cls]||0)+1);
  clsKeys=Object.entries(cls).sort((a,b)=>b[1]-a[1]);
  $('classes').innerHTML=clsKeys.map(([k,v],i)=>`<tr><td><label style="margin:0;justify-content:flex-start"><input type="checkbox" data-i="${i}" ${hidden.has(k)?'':'checked'}> <i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:hsl(${hue(k)},70%,50%)"></i> ${k.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</label></td><td>${v}</td><td><a href="#" data-only="${i}" class="mute">only</a></td></tr>`).join('');
  const tiny=brushes.filter(b=>b.dim<=16).length, small=brushes.filter(b=>b.dim<=64).length;
  const hid=brushes.filter(b=>b.hidden).length, many=brushes.filter(b=>b.sides>=8).length;
  const ids={}; let dup=0; brushes.forEach(b=>{const k=b.mn+'|'+b.mx; ids[k]=(ids[k]||0)+1; if(ids[k]>1)dup++;});
  $('diag').innerHTML=`Tiny brushes (≤16u): <b>${tiny}</b><br>Small brushes (≤64u): <b>${small}</b><br>Overlapping duplicates (identical bounds): <b>${dup}</b><br>Hidden (visgroup) brushes: <b>${hid}</b><br>Brushes with 8+ sides (curves/cylinders): <b>${many}</b>`;
}

const canvas=$('c'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(55,1,1,200000);
camera.up.set(0,0,1); camera.position.set(2000,-2000,1500);
const controls=new THREE.OrbitControls(camera,canvas); controls.screenSpacePanning=true;
let grid=new THREE.GridHelper(16384,64,0x888888,0x444444); grid.rotation.x=Math.PI/2; scene.add(grid);
scene.add(new THREE.AxesHelper(512));
function resize(){const v=$('view'); renderer.setSize(v.clientWidth,v.clientHeight,false); camera.aspect=v.clientWidth/v.clientHeight; camera.updateProjectionMatrix();
  renderer.setClearColor(0x000000);}
addEventListener('resize',resize); resize();
(function loop(){requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera);})();

let cellList=[], shown=[], selCell=null, selList=[], flat=false, curSize=256, izMin=0, view2D=false, olLines=null;
const selGroup=new THREE.Group(); scene.add(selGroup);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const hue=s=>{let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))%360; return h;};
function clear(o){ if(o){scene.remove(o); o.geometry.dispose(); o.material.dispose();} }
function lines(list,color,op){
  const p=[];
  for(const b of list){ const a=b.mn,c=b.mx;
    const v=[[a[0],a[1],a[2]],[c[0],a[1],a[2]],[c[0],c[1],a[2]],[a[0],c[1],a[2]],[a[0],a[1],c[2]],[c[0],a[1],c[2]],[c[0],c[1],c[2]],[a[0],c[1],c[2]]];
    for(const [i,j] of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]) p.push(...v[i],...v[j]);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  return new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
}
function bounds(){ const bx=new THREE.Box3(); brushes.forEach(b=>{bx.expandByPoint(new THREE.Vector3(...b.mn)); bx.expandByPoint(new THREE.Vector3(...b.mx));}); return bx; }
function buildGrid(size){
  if(grid){scene.remove(grid); grid.geometry.dispose(); grid=null;}
  if(!brushes.length) return;
  const bx=bounds(), x0=Math.floor(bx.min.x/size), y0=Math.floor(bx.min.y/size);
  let n=Math.max(Math.ceil(bx.max.x/size)-x0, Math.ceil(bx.max.y/size)-y0)+2; n=Math.min(n+(n%2),400);
  grid=new THREE.GridHelper(n*size,n,0x888888,0x444444); grid.rotation.x=Math.PI/2;
  grid.position.set((x0+n/2)*size,(y0+n/2)*size,bx.min.z); scene.add(grid);
}
function pass(b){
  if(b.isWorld?!$('fw').checked:!$('fe').checked) return false;
  if(hidden.has(b.cls)) return false;
  const md=+$('fmax').value; return !(md>0&&b.dim>md);
}
function rebuild(){
  clear(mesh); mesh=null; clear(olLines); olLines=null;
  const size=curSize=+$('cell').value, minc=+$('fmin').value, zs=+$('fz').value, dens=$('fcol').value==='d', lg=$('flog').checked;
  let zlo=1e9, zhi=-1e9; for(const b of brushes){const z=Math.floor(b.c[2]/size); if(z<zlo)zlo=z; if(z>zhi)zhi=z;}
  const nz=brushes.length?zhi-zlo+1:0; izMin=nz?zlo:0; $('fz').max=nz; const zsel=Math.min(zs,nz);
  $('fzv').textContent=zsel?`${(zlo+zsel-1)*size} to ${(zlo+zsel)*size}`:'All';
  flat=view2D&&!zsel;
  shown=brushes.filter(b=>pass(b)&&(!zsel||Math.floor(b.c[2]/size)===zlo+zsel-1));
  const cells=new Map();
  for(const b of shown){
    const ix=Math.floor(b.c[0]/size), iy=Math.floor(b.c[1]/size), iz=flat?0:Math.floor(b.c[2]/size), k=ix+','+iy+','+iz;
    const c=cells.get(k)||{ix,iy,iz,n:0,cls:{}}; c.n++; c.cls[b.cls]=(c.cls[b.cls]||0)+1; cells.set(k,c);
  }
  const all=[...cells.values()], top=all.reduce((m,c)=>Math.max(m,c.n),1);
  $('fmin').max=top; const mc=Math.min(minc,top); $('fminv').textContent=mc+' / '+top;
  cellList=all.filter(c=>c.n>=mc).sort((a,b)=>b.n-a.n);
  const tot=cellList.reduce((s,c)=>s+c.n,0);
  $('out').textContent=brushes.length?`${tot} brushes shown in ${cellList.length} cells`:'Load a VMF to begin.';
  $('cells').innerHTML=cellList.slice(0,15).map((c,i)=>`<tr class="click" data-i="${i}"><td>(${c.ix*size}, ${c.iy*size}${flat?'':', '+c.iz*size})</td><td>${c.n}</td></tr>`).join('');
  $('grad').style.display=dens?'':'none';
  $('lt').textContent=dens?(lg?'brushes per cell (log scale)':'brushes per cell'):'color = dominant class in cell';
  $('lmin').textContent=dens&&cellList.length?cellList[cellList.length-1].n:''; $('lmax').textContent=dens&&cellList.length?cellList[0].n:'';
  buildGrid(size);
  if($('fol').checked&&shown.length){olLines=lines(shown,0x888888,.3); scene.add(olLines);}
  if(!fitted&&brushes.length){
    const bx=bounds(), ctr=bx.getCenter(new THREE.Vector3()), r=bx.getSize(new THREE.Vector3()).length()*.7||2000;
    controls.target.copy(ctr);
    if(view2D) camera.position.set(ctr.x,ctr.y-1,ctr.z+r*1.2); else camera.position.set(ctr.x+r,ctr.y-r,ctr.z+r*.7);
    fitted=true;
  }
  if(!cellList.length){showSel(null); return;}
  const max=cellList[0].n, min=cellList[cellList.length-1].n;
  const geo=new THREE.BoxGeometry(size*.96,size*.96,flat?size*.1:size*.96);
  const mat=new THREE.MeshBasicMaterial({transparent:true,opacity:+$('fop').value/100,depthWrite:false});
  mesh=new THREE.InstancedMesh(geo,mat,cellList.length);
  const m=new THREE.Matrix4(), col=new THREE.Color();
  cellList.forEach((c,i)=>{
    m.setPosition((c.ix+.5)*size,(c.iy+.5)*size,flat?izMin*size:(c.iz+.5)*size); mesh.setMatrixAt(i,m);
    if(dens){ const t=max===min?1:lg?(Math.log(c.n)-Math.log(min))/(Math.log(max)-Math.log(min)):(c.n-min)/(max-min); col.setHSL(.667*(1-t),.9,.5); }
    else { const k=Object.entries(c.cls).sort((a,b)=>b[1]-a[1])[0][0]; col.setHSL(hue(k)/360,.7,.5); }
    mesh.setColorAt(i,col);
  });
  scene.add(mesh);
  const keep=selCell&&cellList.find(c=>c.ix===selCell.ix&&c.iy===selCell.iy&&(selFlat!==flat||flat||c.iz===selCell.iz));
  showSel(keep||null);
}
function showSel(c){
  selCell=c; selFlat=flat; selGroup.children.slice().forEach(o=>{selGroup.remove(o); o.geometry.dispose(); o.material.dispose();});
  if(!c){ selList=[]; $('sel').textContent='Click a cell in the view.'; return; }
  const s=curSize, fz=Math.floor;
  selList=shown.filter(b=>fz(b.c[0]/s)===c.ix&&fz(b.c[1]/s)===c.iy&&(flat||fz(b.c[2]/s)===c.iz)).sort((a,b)=>a.dim-b.dim);
  const z0=flat?izMin*s:c.iz*s, box={mn:[c.ix*s,c.iy*s,z0],mx:[(c.ix+1)*s,(c.iy+1)*s,flat?z0+s*.1:z0+s]};
  selGroup.add(lines([box],0xffffff,1)); if(selList.length) selGroup.add(lines(selList,0xffd43b,1));
  $('sel').innerHTML=`<div>Cell (${c.ix*s}, ${c.iy*s}${flat?'':', '+c.iz*s}) · ${selList.length} brushes</div><div style="max-height:220px;overflow:auto;margin-top:4px"><table><tr><td><b>Brush ID</b></td><td><b>Class</b></td><td><b>Size</b></td></tr>${selList.slice(0,300).map(b=>`<tr><td>${b.id}</td><td>${esc(b.cls)}</td><td>${Math.round(b.dim)}u</td></tr>`).join('')}</table></div>${selList.length>300?'<div>…more, use Copy IDs</div>':''}`;
}
$('selcopy').onclick=()=>{
  const t=selList.map(b=>b.id).join(' '); if(!t) return;
  const done=()=>{$('selcopy').textContent='Copied'; setTimeout(()=>$('selcopy').textContent='Copy IDs',1200);};
  (navigator.clipboard?navigator.clipboard.writeText(t).then(done):Promise.reject()).catch(()=>prompt('Brush IDs (Ctrl+C):',t));
};
function setView(v){
  view2D=v; controls.enableRotate=!v;
  const bx=bounds(), ctr=brushes.length?bx.getCenter(new THREE.Vector3()):controls.target.clone(), sz=brushes.length?bx.getSize(new THREE.Vector3()):new THREE.Vector3(2000,2000,0), d=Math.max(sz.x,sz.y,500);
  controls.target.copy(ctr);
  if(v) camera.position.set(ctr.x,ctr.y-1,ctr.z+d*.95); else camera.position.set(ctr.x+d*.7,ctr.y-d*.7,ctr.z+d*.5);
  controls.update(); rebuild();
  if(selCell) flyTo(new THREE.Vector3((selCell.ix+.5)*curSize,(selCell.iy+.5)*curSize,flat?izMin*curSize:(selCell.iz+.5)*curSize),curSize);
}
$('v3').onclick=()=>setView(false); $('v2').onclick=()=>setView(true);
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(e){
  if(!mesh) return -1;
  const r=canvas.getBoundingClientRect(); mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera); const h=ray.intersectObject(mesh); return h.length?h[0].instanceId:-1;
}
canvas.addEventListener('pointermove',e=>{
  const i=pick(e), t=$('tip'); if(i<0){t.style.display='none'; return;}
  const c=cellList[i], s=curSize, r=$('view').getBoundingClientRect();
  t.style.display='block'; t.style.left=(e.clientX-r.left+12)+'px'; t.style.top=(e.clientY-r.top+12)+'px';
  t.textContent=`${c.n} brushes · x ${c.ix*s}..${(c.ix+1)*s}, y ${c.iy*s}..${(c.iy+1)*s}${flat?'':`, z ${c.iz*s}..${(c.iz+1)*s}`}`;
});
canvas.addEventListener('pointerleave',()=>$('tip').style.display='none');
let tw=null, selFlat=false;
controls.addEventListener('start',()=>tw=null);
function flyTo(t,size){
  const dir=view2D?new THREE.Vector3(0,-.001,1):camera.position.clone().sub(controls.target).normalize();
  const d=size*.87/Math.sin(camera.fov*Math.PI/360)*1.15/Math.min(1,camera.aspect);
  const p1=t.clone().add(dir.multiplyScalar(d)), t0=controls.target.clone(), p0=camera.position.clone(), st=performance.now(), id=tw={};
  (function step(){ if(tw!==id) return; const k=Math.min(1,(performance.now()-st)/400), e=k*k*(3-2*k);
    controls.target.lerpVectors(t0,t,e); camera.position.lerpVectors(p0,p1,e); if(k<1) requestAnimationFrame(step); })();
}
canvas.addEventListener('dblclick',e=>{
  const i=pick(e); if(i<0) return; const c=cellList[i], s=curSize;
  showSel(c); flyTo(new THREE.Vector3((c.ix+.5)*s,(c.iy+.5)*s,flat?izMin*s:(c.iz+.5)*s),s);
});
let down=null;
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{ if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4) return; const i=pick(e); showSel(i<0?null:cellList[i]); });
$('cells').addEventListener('click',e=>{
  const tr=e.target.closest('tr'); if(!tr) return; const c=cellList[+tr.dataset.i], s=curSize;
  const t=new THREE.Vector3((c.ix+.5)*s,(c.iy+.5)*s,flat?izMin*s:(c.iz+.5)*s);
  flyTo(t,s); showSel(c);
});
['cell','fw','fe','fmax','fmin','fop','flog','fcol','fz','fol'].forEach(id=>$(id).addEventListener('input',()=>{ if(id==='fop'&&mesh) mesh.material.opacity=+$('fop').value/100; else rebuild(); }));

$('classes').addEventListener('change',e=>{const i=e.target.dataset.i; if(i===undefined) return; const k=clsKeys[+i][0]; if(e.target.checked) hidden.delete(k); else hidden.add(k); rebuild();});
$('classes').addEventListener('click',e=>{const i=e.target.dataset.only; if(i===undefined) return; e.preventDefault(); hidden=new Set(clsKeys.map(x=>x[0])); hidden.delete(clsKeys[+i][0]); stats(); rebuild();});
$('clsall').onclick=()=>{hidden=new Set(); stats(); rebuild();};
$('clsnone').onclick=()=>{hidden=new Set(clsKeys.map(x=>x[0])); stats(); rebuild();};

const drop=$('drop');
drop.onclick=()=>$('file').click();
$('file').onchange=e=>readFile(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault(); drop.classList.add('over');};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault(); drop.classList.remove('over'); readFile(e.dataTransfer.files[0]);};
document.body.addEventListener('dragover',e=>e.preventDefault());
document.body.addEventListener('drop',e=>{e.preventDefault(); if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);});
function readFile(f){
  if(!f) return; $('out').textContent='Parsing '+f.name+'…';
  f.text().then(t=>setTimeout(()=>{try{load(t);}catch(err){$('out').textContent='Parse error: '+err.message;}},20));
}
</script>
</body>
